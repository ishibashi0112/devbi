name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # For the read-only API's PostgreSQL tests (packages/server/test/postgres.test.ts).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: devbi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # SQL Server, MySQL, MariaDB and Oracle for packages/server/test/databases.test.ts.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: DevBI_test1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P DevBI_test1 -Q 'SELECT 1' -b"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: devbi
          MYSQL_DATABASE: devbi
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pdevbi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: devbi
          MARIADB_DATABASE: devbi
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: devbi
          APP_USER: devbi
          APP_USER_PASSWORD: devbi
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      DEVBI_TEST_PG: postgres://postgres:devbi@localhost:5432/postgres
      DEVBI_TEST_MSSQL: mssql://sa:DevBI_test1@localhost:1433/master
      DEVBI_TEST_MYSQL: mysql://root:devbi@localhost:3306/devbi
      DEVBI_TEST_MARIADB: mariadb://root:devbi@localhost:3307/devbi
      DEVBI_TEST_ORACLE: oracle://devbi:devbi@localhost:1521/FREEPDB1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter devbi-example-sales check
      # The live demo's dashboard (examples/oss) on made-up numbers; .github/workflows/demo.yml runs it on the real ones.
      - run: pnpm --filter devbi-example-oss fixture
      - run: pnpm --filter devbi-example-oss check
      - run: pnpm --filter devbi-example-sales exec playwright install --with-deps chromium
      - run: pnpm e2e
      # The same dashboards in a Next.js app (examples/nextjs): next build of the sales build above, then next start.
      - run: pnpm --filter devbi-example-nextjs e2e
      # Again on SQL Server: the driver (mssql) has to load inside Next.js's build of the route.
      - run: pnpm --filter devbi-example-sales copy-db "$DEVBI_TEST_MSSQL"
      - run: pnpm --filter devbi-example-nextjs exec playwright test --trace off
        env:
          DEVBI_DB: ${{ env.DEVBI_TEST_MSSQL }}
          DEVBI_SNAPSHOTS: snapshots-mssql

  # The packages as npm would publish them (pnpm pack), installed with npm and with pnpm into a project create-devbi
  # makes: its typecheck, build, and dev server with the GUI editor (scripts/check-packed.mjs).
  packed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter create-devbi exec playwright install --with-deps chromium
      - run: pnpm check:packed

  # The ASP.NET (C#) reference of the read-only API (dotnet/): its tests against SQL Server, then the sales
  # example's dashboards on the ASP.NET Core sample instead of devbi-serve.
  dotnet:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: DevBI_test1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P DevBI_test1 -Q 'SELECT 1' -b"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    env:
      DEVBI_TEST_MSSQL: mssql://sa:DevBI_test1@localhost:1433/master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # .NET Framework's part (DevBI.Server.SystemWeb) builds here too, from reference assemblies.
      - run: dotnet build dotnet/DevBI.sln
      - run: dotnet test dotnet/DevBI.sln --no-build
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter devbi-example-sales build
      - run: pnpm --filter devbi-example-sales copy-db "$DEVBI_TEST_MSSQL"
      - run: pnpm --filter devbi-example-sales exec playwright install --with-deps chromium
      - name: Start the ASP.NET Core sample on port 4179
        env:
          ConnectionStrings__DEVBI_DB: Server=tcp:localhost,1433;Database=master;User Id=sa;Password=DevBI_test1;TrustServerCertificate=true;Encrypt=false
        run: |
          dotnet run --no-build --project dotnet/samples/DevBI.Sample -- --urls http://127.0.0.1:4179 > "$RUNNER_TEMP/sample.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4179/api/schema > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/sample.log"
          exit 1
      # All but the tests of devbi-serve's own parts: the snapshots it makes, and its API under any path.
      - run: pnpm --filter devbi-example-sales exec playwright test --trace off --grep-invert "the API lists its SQL files|reads the saved file, not the database|somewhere else \(in the host app\)"
        env:
          E2E_BASE_URL: http://127.0.0.1:4179
      - if: failure()
        run: cat "$RUNNER_TEMP/sample.log"
