name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # For the read-only API's PostgreSQL tests (packages/server/test/postgres.test.ts).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: devbi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEVBI_TEST_PG: postgres://postgres:devbi@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter devbi-example-sales exec playwright install --with-deps chromium
      - run: pnpm e2e
