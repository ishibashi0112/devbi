name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # For the read-only API's PostgreSQL tests (packages/server/test/postgres.test.ts).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: devbi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # SQL Server, MySQL and Oracle for packages/server/test/databases.test.ts.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: DevBI_test1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P DevBI_test1 -Q 'SELECT 1' -b"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: devbi
          MYSQL_DATABASE: devbi
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pdevbi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: devbi
          APP_USER: devbi
          APP_USER_PASSWORD: devbi
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      DEVBI_TEST_PG: postgres://postgres:devbi@localhost:5432/postgres
      DEVBI_TEST_MSSQL: mssql://sa:DevBI_test1@localhost:1433/master
      DEVBI_TEST_MYSQL: mysql://root:devbi@localhost:3306/devbi
      DEVBI_TEST_ORACLE: oracle://devbi:devbi@localhost:1521/FREEPDB1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter devbi-example-sales exec playwright install --with-deps chromium
      - run: pnpm e2e
