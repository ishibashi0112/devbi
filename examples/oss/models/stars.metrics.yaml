# yaml-language-server: $schema=../.devbi/metrics.schema.json
# GitHub のスター 1 つが 1 行（付いた日とリポジトリ）。data/stars.csv は scripts/fetch-stats.mjs が書く。
label: GitHub のスター
model: |
  SELECT * FROM read_csv('data/stars.csv', header = true, columns = {'date': 'DATE', 'repo': 'VARCHAR'})
time: { column: date, label: 日付 }
dimensions:
  repo: { column: repo, label: リポジトリ }
measures:
  stars: { sql: COUNT(*), label: 増えたスター, format: "#,##0" }
  stars_total: { of: stars, running: all, label: スター }
